name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run containing the tested package
        type: string
        required: true
      version:
        description: Stable SemVer to publish, for example 1.0.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' && vars.NPM_PUBLICATION_READY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-production
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_PUBLICATION_READY: ${{ vars.NPM_PUBLICATION_READY }}
    steps:
      - name: Check out trusted main release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - name: Install official publication CLIs
        env:
          GH_ARCHIVE_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$GH_ARCHIVE_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Select the successful main CI build
        id: build
        env:
          REQUESTED_RUN: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: node .github/scripts/artifact.ts release "$REQUESTED_RUN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.build.outputs.artifact-id }}
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build
      - name: Prepare release metadata without rebuilding runtime files
        env:
          RELEASE_SOURCE_SHA: ${{ steps.build.outputs.source-sha }}
          CI_RUN_ID: ${{ steps.build.outputs.run-id }}
          CI_RUN_ATTEMPT: ${{ steps.build.outputs.run-attempt }}
          STABLE_VERSION: ${{ inputs.version }}
        run: |
          args=(--input "$RUNNER_TEMP/build" --output "$RUNNER_TEMP/release")
          if [ -n "$STABLE_VERSION" ]; then args+=(--version "$STABLE_VERSION"); fi
          node .github/scripts/release.ts prepare "${args[@]}"
          cat "$RUNNER_TEMP/release/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish npm, verify CDN and create GitHub Release
        env:
          RELEASE_SOURCE_SHA: ${{ steps.build.outputs.source-sha }}
        run: node .github/scripts/release.ts publish --directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          retention-days: 90
