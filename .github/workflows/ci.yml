name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Package, coverage and three browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Record Node 22 consumer executable
        id: node22
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Record Node 26 consumer executable
        id: node26
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          package_json_file: candidate/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Install pinned npm and frozen dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          pnpm install --frozen-lockfile
          node --version
          pnpm --version
          npm --version
      - name: Install actual browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Lint
        run: pnpm lint
      - name: Strict type check
        run: pnpm typecheck
      - name: Node tests and enforced coverage
        run: pnpm test:node --coverage
      - name: Build all five executable files
        run: pnpm build
      - name: Distribution consumers
        run: pnpm test:distribution
      - name: Chromium, Firefox and WebKit unit tests
        run: pnpm test:browser
      - name: HTTP, module, classic, file and Worker consumers
        run: pnpm test:e2e
      - name: Verify one archive in Node 22, 24 and 26 and all browsers
        env:
          NODE22: ${{ steps.node22.outputs.path }}
          NODE26: ${{ steps.node26.outputs.path }}
        run: pnpm verify:package --node "$NODE22" --node "$NODE26"
      - name: Preserve test, coverage and distribution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-validation
          path: |
            candidate/dist/
            candidate/artifacts/package/
            candidate/artifacts/coverage/
            candidate/artifacts/playwright-report/
            candidate/artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30

  node26:
    name: Node 26 source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:node

  benchmark:
    name: Paired 45-lock target comparison
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out the actual PR target commit separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || '3cbbeedbb409a2d8ffa5b00c778cfcb0b07c0ec6' }}
          path: baseline
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          package_json_file: candidate/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-validation
          path: candidate
      - name: Build a TypeScript target in the same runtime when needed
        run: |
          if [ ! -f ../baseline/src/index.mjs ]; then
            pnpm --dir ../baseline install --frozen-lockfile
            pnpm --dir ../baseline build
          fi
      - name: Generate baseline from the separately checked-out source
        id: baseline
        run: node .github/scripts/ci-baseline.ts checkout ../baseline artifacts/baseline
      - name: Compare exact built candidate and target, with isolated RSS samples
        env:
          BASELINE_MODULE: ${{ steps.baseline.outputs.module }}
          BASELINE_SNAPSHOT: ${{ steps.baseline.outputs.snapshot }}
          BASELINE_FORMAT: ${{ steps.baseline.outputs.format }}
        run: pnpm benchmark:compare --candidate-module dist/gothic-lock-solver.mjs --baseline-module "$BASELINE_MODULE" --baseline-snapshot "$BASELINE_SNAPSHOT" --baseline-format "$BASELINE_FORMAT" --output-dir artifacts/benchmark
      - name: Show benchmark verdict and measurements
        if: always()
        run: |
          for report in artifacts/benchmark/run-*/benchmark.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve raw benchmark and baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-benchmark
          path: |
            candidate/artifacts/benchmark/
            candidate/artifacts/baseline/
          if-no-files-found: warn
          retention-days: 30
