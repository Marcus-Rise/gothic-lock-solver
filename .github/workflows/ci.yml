name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Record Node 22
        id: node22
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Record Node 26
        id: node26
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install tools and browsers
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check source, bundles and installed package
        env:
          NODE22: ${{ steps.node22.outputs.path }}
          NODE26: ${{ steps.node26.outputs.path }}
        run: |
          pnpm check
          pnpm test:coverage
          "$NODE26" node_modules/vitest/vitest.mjs run --project node
          pnpm build
          pnpm test:distribution
          pnpm test:browser
          pnpm test:e2e
          pnpm verify:package --node "$NODE22" --node "$NODE26"
      - name: Find the exact target SHA report
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/artifact.ts baseline "$TARGET_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.baseline.outputs.available == 'true'
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact-id }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Measure all 45 locks
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          if [ "$BASELINE_AVAILABLE" = true ]; then
            pnpm benchmark --baseline-report "$RUNNER_TEMP/baseline/benchmark.json" --baseline-sha "$TARGET_SHA"
          else
            pnpm benchmark --baseline-sha "$TARGET_SHA"
          fi
      - name: Show the benchmark report
        if: always()
        run: test ! -f artifacts/benchmark/benchmark.md || cat artifacts/benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: artifacts/benchmark/
          retention-days: 90
      - name: Collect the tested distribution
        run: |
          mkdir -p artifacts/build
          cp dist/gothic-lock-solver.{mjs,min.mjs,js,min.js,cli.mjs} artifacts/build/
          cp artifacts/package/package.tgz artifacts/benchmark/benchmark.{json,md} artifacts/build/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/
            artifacts/playwright-report/
            artifacts/test-results/
          retention-days: 14
