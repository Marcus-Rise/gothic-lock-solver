name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  build:
    name: Build and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install tools and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          pnpm install --frozen-lockfile
      - name: Check and build the distribution
        run: |
          pnpm check
          pnpm build
          pnpm test:distribution
      - name: Benchmark against the exact target SHA when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$TARGET_SHA" && "$TARGET_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--baseline-sha "$TARGET_SHA")
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$TARGET_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then
              artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name == \"benchmark-$TARGET_SHA\" and .expired == false) | .id")
              if [[ -n "$artifact_id" ]]; then
                gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "benchmark-$TARGET_SHA" --dir "$RUNNER_TEMP/baseline"
                args+=(--baseline-report "$RUNNER_TEMP/baseline/benchmark.json")
              fi
            fi
          fi
          pnpm benchmark "${args[@]}"
      - name: Show the benchmark report
        if: always()
        run: test ! -f artifacts/benchmark/benchmark.md || cat artifacts/benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-${{ env.SOURCE_SHA }}
          overwrite: true
          path: artifacts/benchmark/
          retention-days: 90
      - name: Pack the built distribution
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          mkdir -p artifacts/build
          mv "$RUNNER_TEMP/package/"*.tgz artifacts/build/package.tgz
          cp artifacts/benchmark/benchmark.{json,md} artifacts/build/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ env.SOURCE_SHA }}
          overwrite: true
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 90

  test:
    name: Node ${{ matrix.node }} / ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '22.23.2', project: node }
          - { node: '24.19.0', project: node }
          - { node: '26.8.1', project: node }
          - { node: '24.19.0', project: chromium }
          - { node: '24.19.0', project: firefox }
          - { node: '24.19.0', project: webkit }
    defaults:
      run:
        shell: bash
    env:
      NODE_VERSION: ${{ matrix.node }}
      PROJECT: ${{ matrix.project }}
      BROWSER: ${{ matrix.project == 'node' && 'none' || matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install tools and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/build
      - name: Extract the same built distribution
        run: tar -xzf "$RUNNER_TEMP/build/package.tgz" --strip-components=1 -C . package/dist
      - name: Install the selected browser
        if: matrix.project != 'node'
        run: pnpm exec playwright install --with-deps "$PROJECT"
      - name: Test the selected environment
        run: |
          if [[ "$PROJECT" == node && "$NODE_VERSION" == 24.19.0 ]]; then
            pnpm test:coverage
          else
            pnpm exec vitest run --project "$PROJECT"
          fi
      - name: Verify browser pages and Workers
        if: matrix.project != 'node'
        run: |
          node tests/e2e/build-fixtures.ts
          pnpm exec playwright test --project "$PROJECT"
      - name: Verify the installed build archive
        run: pnpm verify:package --archive "$RUNNER_TEMP/build/package.tgz" --browser "$BROWSER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-node-${{ matrix.node }}-${{ matrix.project }}
          path: |
            artifacts/coverage/
            artifacts/playwright-report/
            artifacts/test-results/
          retention-days: 14
