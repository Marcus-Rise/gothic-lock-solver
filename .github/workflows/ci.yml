name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  build:
    name: Build and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install tools and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          pnpm install --frozen-lockfile
      - name: Check and build the distribution
        run: |
          pnpm check
          pnpm build
          pnpm test:distribution
      - name: Install official GitHub CLI
        env:
          GH_ARCHIVE_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$GH_ARCHIVE_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar --no-same-owner -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.100.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Find the exact target SHA report
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$TARGET_SHA" || "$TARGET_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No target commit; benchmark comparison skipped."
            exit 0
          fi
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&status=success&per_page=100" --jq '
            .workflow_runs[]
            | select(.head_sha == env.TARGET_SHA
              and .repository.full_name == env.GITHUB_REPOSITORY
              and .head_repository.full_name == env.GITHUB_REPOSITORY
              and .status == "completed" and .conclusion == "success"
              and (.path | split("@")[0]) == ".github/workflows/ci.yml")
            | .id')
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"benchmark-$TARGET_SHA\" and .expired == false) | .id")
            if [[ -n "$artifact_id" ]]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
              echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "No report for the exact target SHA; benchmark comparison skipped."
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.baseline.outputs.available == 'true'
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact-id }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Measure all 45 locks
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          if [ "$BASELINE_AVAILABLE" = true ]; then
            pnpm benchmark --baseline-report "$RUNNER_TEMP/baseline/benchmark.json" --baseline-sha "$TARGET_SHA"
          elif [[ -n "$TARGET_SHA" && "$TARGET_SHA" != 0000000000000000000000000000000000000000 ]]; then
            pnpm benchmark --baseline-sha "$TARGET_SHA"
          else
            pnpm benchmark
          fi
      - name: Show the benchmark report
        if: always()
        run: test ! -f artifacts/benchmark/benchmark.md || cat artifacts/benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-${{ env.SOURCE_SHA }}
          overwrite: true
          path: artifacts/benchmark/
          retention-days: 90
      - name: Collect the tested distribution
        run: |
          mkdir "$RUNNER_TEMP/package"
          mkdir -p artifacts/build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          mv "$RUNNER_TEMP/package/"*.tgz artifacts/build/package.tgz
          cp dist/gothic-lock-solver.{mjs,min.mjs,js,min.js,cli.mjs} artifacts/build/
          cp artifacts/benchmark/benchmark.{json,md} artifacts/build/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ env.SOURCE_SHA }}
          overwrite: true
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 90

  test:
    name: Node ${{ matrix.node }} / ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '22.23.2', project: node }
          - { node: '24.19.0', project: node }
          - { node: '26.8.1', project: node }
          - { node: '24.19.0', project: chromium }
          - { node: '24.19.0', project: firefox }
          - { node: '24.19.0', project: webkit }
    defaults:
      run:
        shell: bash
    env:
      NODE_VERSION: ${{ matrix.node }}
      PROJECT: ${{ matrix.project }}
      BROWSER: ${{ matrix.project == 'node' && 'none' || matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install tools and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/build
      - name: Extract the same built distribution
        run: tar -xzf "$RUNNER_TEMP/build/package.tgz" --strip-components=1 -C . package/dist
      - name: Install the selected browser
        if: matrix.project != 'node'
        run: pnpm exec playwright install --with-deps "$PROJECT"
      - name: Test the selected environment
        run: |
          if [[ "$PROJECT" == node && "$NODE_VERSION" == 24.19.0 ]]; then
            pnpm test:coverage
          else
            pnpm exec vitest run --project "$PROJECT"
          fi
      - name: Verify browser pages and Workers
        if: matrix.project != 'node'
        run: |
          node tests/e2e/build-fixtures.ts
          pnpm exec playwright test --project "$PROJECT"
      - name: Verify the installed build archive
        run: pnpm verify:package --archive "$RUNNER_TEMP/build/package.tgz" --browser "$BROWSER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-node-${{ matrix.node }}-${{ matrix.project }}
          path: |
            artifacts/coverage/
            artifacts/playwright-report/
            artifacts/test-results/
          retention-days: 14
