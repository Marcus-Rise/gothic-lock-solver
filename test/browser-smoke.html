<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Gothic solver browser verification</title>
<h1>Browser ESM and Worker verification</h1>
<pre id="result">Running…</pre>
<script type="module">
import { solveLock } from '../src/index.mjs';

const output = document.querySelector('#result');
const definition = {
  state: Array(8).fill(1),
  links: Array.from({ length: 8 }, () => Array(8).fill(0)),
};
function check(result) {
  if (result.status !== 'solved' || result.commands.length !== 8 ||
      result.finalState.some(position => position !== 4)) {
    throw new Error('Unexpected eight-plate solution');
  }
}
try {
  check(solveLock(definition));
  const worker = new Worker(new URL('../scripts/browser/worker.mjs', import.meta.url), { type: 'module' });
  try {
    const message = await new Promise((resolve, reject) => {
      worker.onmessage = event => resolve(event.data);
      worker.onerror = event => reject(new Error(event.message));
      worker.postMessage(definition);
    });
    if (message.error) throw new Error(message.error.message);
    check(message.result);
    output.textContent = JSON.stringify({ status: 'passed', mainThread: true, moduleWorker: true, plates: 8, actions: 8 }, null, 2);
  } finally {
    worker.terminate();
  }
} catch (error) {
  output.textContent = JSON.stringify({ status: 'failed', message: error.message }, null, 2);
}
</script>
</html>
